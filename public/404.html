<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Ced Cantong</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: #0A0A0A;
    color: #F0F0F0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    text-align: center;
  }
  .code { margin: 0; font-size: clamp(4rem, 22vw, 8rem); font-weight: 700; line-height: 1; color: #ffe000; }
  h1 { margin: 16px 0 8px; font-size: clamp(1.5rem, 6vw, 2rem); }
  p { margin: 0 0 32px; color: rgba(255, 255, 255, 0.75); }
  a {
    display: inline-block;
    padding: 12px 24px;
    background: #ffe000;
    color: #0A0A0A;
    font-weight: 600;
    text-decoration: none;
    border-radius: 8px;
  }
  a:hover { background: #fff37a; }
  a:focus-visible { outline: 3px solid #F0F0F0; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>This page doesn't exist or has moved.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
